<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e184a"/>
      <stop offset="100%" stop-color="#0c0a21"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#00e5a3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="url(#frameGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Abacus Outer Frame -->
  <rect x="10" y="10" width="44" height="44" rx="6" fill="#131033" stroke="#6c63ff" stroke-width="2"/>

  <!-- Horizontal Beam (Divider) -->
  <line x1="10" y1="26" x2="54" y2="26" stroke="#8e91be" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Vertical Rods -->
  <line x1="20" y1="11" x2="20" y2="53" stroke="rgba(142, 145, 190, 0.4)" stroke-width="1.5"/>
  <line x1="32" y1="11" x2="32" y2="53" stroke="rgba(142, 145, 190, 0.4)" stroke-width="1.5"/>
  <line x1="44" y1="11" x2="44" y2="53" stroke="rgba(142, 145, 190, 0.4)" stroke-width="1.5"/>

  <!-- Upper Deck Beads (5s) -->
  <ellipse cx="20" cy="18" rx="4.5" ry="3" fill="#f59e0b" filter="url(#glow)"/>
  <ellipse cx="32" cy="21" rx="4.5" ry="3" fill="#6c63ff" filter="url(#glow)"/>
  <ellipse cx="44" cy="18" rx="4.5" ry="3" fill="#00e5a3" filter="url(#glow)"/>

  <!-- Lower Deck Beads (1s) -->
  <ellipse cx="20" cy="33" rx="4.5" ry="3" fill="#00e5a3"/>
  <ellipse cx="20" cy="40" rx="4.5" ry="3" fill="#00e5a3"/>
  
  <ellipse cx="32" cy="33" rx="4.5" ry="3" fill="#6c63ff"/>
  <ellipse cx="32" cy="47" rx="4.5" ry="3" fill="#6c63ff"/>

  <ellipse cx="44" cy="40" rx="4.5" ry="3" fill="#f59e0b"/>
  <ellipse cx="44" cy="47" rx="4.5" ry="3" fill="#f59e0b"/>
</svg>
